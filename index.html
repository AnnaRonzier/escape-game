<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Archive — Rush 04</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#eee;font-family:Georgia,'Times New Roman',serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");mix-blend-mode:screen}.wrap{width:min(90vw,520px);text-align:center;position:relative;z-index:2}.top{font-family:Arial,sans-serif;font-size:11px;letter-spacing:4px;color:#777;margin-bottom:28px}.line{height:1px;background:#333;margin:0 auto 32px}.rush{font-family:Arial,sans-serif;font-size:clamp(48px,14vw,82px);font-weight:300;letter-spacing:8px;margin:0 0 8px}.subtitle{font-family:Arial,sans-serif;font-size:12px;letter-spacing:5px;color:#777;text-transform:uppercase}.loading{margin:46px auto 30px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;color:#888}.dots span{opacity:0;animation:blink 1.5s infinite}.dots span:nth-child(2){animation-delay:.3s}.dots span:nth-child(3){animation-delay:.6s}@keyframes blink{0%,60%,100%{opacity:0}30%{opacity:1}}.message{min-height:44px;font-size:17px;line-height:1.6;color:#bbb;opacity:0;transition:opacity 1.2s}.message.show{opacity:1}.play{display:none;margin:26px auto 0;padding:15px 27px;border:1px solid #666;background:transparent;color:#eee;font-family:Arial,sans-serif;font-size:12px;letter-spacing:3px;cursor:pointer}.play.show{display:inline-block;animation:appear .8s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.status{margin-top:30px;font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#555}.fade{position:fixed;inset:0;background:#000;z-index:10;pointer-events:none;animation:fadeOut 1.6s ease forwards}@keyframes fadeOut{to{opacity:0}}.playing .loading{display:none}.playing .message{color:#ddd}.corner{position:fixed;left:18px;bottom:15px;font:9px Arial,sans-serif;letter-spacing:2px;color:#333}.scan{position:fixed;right:18px;bottom:15px;font:9px Arial,sans-serif;letter-spacing:2px;color:#333}
</style>
</head>
<body>
<div class="fade"></div><div class="grain"></div>
<div class="wrap" id="page">
  <div class="top">ARCHIVES CINÉMATOGRAPHIQUES</div>
  <div class="line"></div>
  <h1 class="rush">RUSH 04</h1>
  <div class="subtitle">Enregistrement retrouvé</div>
  <div class="loading" id="loading">LECTURE DE L'ARCHIVE <span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="message" id="message">Écoute attentivement...</div>
  <button class="play" id="play">▶ &nbsp; ÉCOUTER L'ENREGISTREMENT</button>
  <div class="status" id="status">ARCHIVE 04 — 00:00:00</div>
</div>
<div class="corner">DOSSIER CLASSÉ</div><div class="scan">SCAN OK</div>
<audio id="audio" preload="auto" playsinline>
  <source src="piste04.mp3" type="audio/mpeg">
</audio>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const message=document.getElementById('message');
const status=document.getElementById('status');
const page=document.getElementById('page');
function showFallback(){message.classList.add('show');play.classList.add('show');}
function start(){audio.play().then(()=>{page.classList.add('playing');message.classList.add('show');play.classList.remove('show');status.textContent='ARCHIVE 04 — LECTURE EN COURS';}).catch(()=>showFallback());}
window.addEventListener('load',()=>{setTimeout(start,1700);});
play.addEventListener('click',()=>{start();});
audio.addEventListener('ended',()=>{status.textContent='ARCHIVE 04 — FIN DE L’ENREGISTREMENT';message.textContent='Fin de l’enregistrement.';});
</script>
</body>
</html>
